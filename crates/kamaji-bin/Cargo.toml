[package]
name = "kamaji-bin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Kamaji — Yubaba's sibling process supervisor. Owns cgroups, pidfds, fork+exec of native workloads, and dispatches container workloads to containerd. R406-T2 ships the single-threaded tokio + UDS skeleton; backend drivers land in T4-T7."

[lib]
name = "kamaji_bin"
path = "src/lib.rs"

[[bin]]
name = "kamaji"
path = "src/main.rs"

[features]
# R406-T9: production containerd backend. Required by the cloud-tier
# kamaji.service unit so `Deploy { Workload::Container }` actually
# starts containers. Excluded from the dev binary by default — non-Linux
# hosts and pond's inner kamaji (which uses the docker socket via
# a different backend) don't need it.
# Forwards onto kamaji-containerd-core's identically-named feature (R592-T1 —
# shared OCI-spec-building / image-resolution / task-status core with the
# inlined `kamaji` crate, so the two deployment shapes cannot drift apart
# again).
containerd-integration = [
    "dep:containerd-client",
    "dep:prost-types",
    "dep:kamaji-containerd-core",
    "kamaji-containerd-core/containerd-integration",
    # Fleet cert-rotation zero-downtime (R600-F9): kamaji is the socket custodian.
    "dep:kamaji",
    "kamaji/socket-custody",
]

# R626-F1: docker/OrbStack backend. Wires the kamaji crate's docker-CLI
# ContainerRuntime into the UDS ServerCtx so `Deploy { Workload::Container }`
# starts a container on a Docker-compatible daemon — the pond / dev-host
# counterpart to `containerd-integration`, which targets the cloud tier's
# containerd. Shells out to `docker`, so it pulls in no extra Rust deps.
# The two can be compiled together (containerd wins when both are configured);
# when neither is, a Container deploy reports a build-aware BackendRefused.
docker-integration = ["dep:kamaji", "kamaji/docker-integration"]

# R599-F10: keep-alive native bundle backend. Wires the kamaji crate's native
# (fork+exec) supervisor + the node bundle store into the UDS ServerCtx so a
# MesofactStatic workload carrying a serve_bundle (lifecycle=KeepAlive) is
# materialized (yah-mesofact-bundle store) and served by forking
# `mesofact-serve --bundle <dir> --listen <addr>`. Excluded from the default
# build (native + object-store weight); when off, deploy_mesofact_bundle returns
# a clear "rebuild with --features bundle-serving" BackendRefused, exactly like
# the containerd None arm.
# R577-T1 / W254: native fork+exec backend for container-shaped workloads that
# cannot run in a container. This is NOT the same thing as `bundle-serving`,
# which also uses the native runtime but owns mesofact-bundle identities; this
# one serves `Workload::Container` specs carrying the `yah.exec = native`
# annotation, i.e. the Darwin build leg — `cargo tauri build`, `codesign` and
# `xcrun notarytool` need a live macOS userland and no container can supply one.
# Off by default (a Linux fleet node has no use for it); when off, a
# native-marked deploy reports a build-aware BackendRefused rather than falling
# back to a container, which would run the job against the wrong OS.
native-exec = ["dep:kamaji", "kamaji/native-integration"]

# R605-F8 / W325 §5: Firecracker microVM backend. Serves `Workload::Container`
# specs carrying `yah.exec = microvm` — the third value on the same substrate
# key `native-exec` reads, so the two are mutually exclusive by construction
# and can be compiled together without any dispatch ambiguity.
#
# Off by default and *stays* off on most nodes: unlike the other backends this
# one needs node-side material a package manager will not supply (a guest
# kernel, a guest rootfs, `/dev/kvm` openable by the service user), so a node
# opts in by having those and passing --microvm-dir. When off, a microVM-marked
# deploy reports a build-aware BackendRefused and does NOT fall back to a
# container — falling back would hand the caller the one thing it declined.
microvm = ["dep:kamaji", "kamaji/microvm-integration"]

bundle-serving = [
    "dep:kamaji",
    "kamaji/native-integration",
    "dep:yah-object-store",
    "dep:yah-mesofact-bundle",
    "yah-mesofact-bundle/store",
]

[dependencies]
kamaji-proto = { path = "../kamaji-proto", version = "0.8.29" }
# R555-F4 (W235 §(c)): `admission-verify` brings in the Ed25519 half of
# `workload_spec::admission`. Not optional — deciding what is allowed to run
# is kamaji's job description, and a build that could silently omit the
# admission gate is a build an operator cannot tell apart from one that has it.
workload-spec = { package = "yah-workload-spec", version = "0.8.29", features = ["admission-verify"] }
# R715-F3 / W315 — the process-control channel. `client` is the consumer half
# the probe runner dials; `kamaji` gives it the ProcState -> WorkloadState
# conversion as an exhaustive match, which is what keeps "believed verbatim"
# true. Pure std + serde + tokio (already linked), so no RSS cost worth
# weighing against W154's memory budget.
kamaji-procctl = { path = "../procctl", version = "0.8.29", features = ["client", "kamaji"] }

anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "sync", "fs", "signal", "time", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# R426-F2 — cheers JWT verifier surface. PASETO v4.public (matches cheers's
# edge-verifiable-auth.md session-token envelope; W159 §Canonical claim schema).
# reqwest fetches cheers's JWKS at boot and on refresh; base64ct decodes the
# Ed25519 public key from the JWK `x` field. All MIT/Apache-2.0.
pasetors = { version = "0.7", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64ct = { version = "1", features = ["alloc"] }

# Containerd gRPC client (optional — only with containerd-integration feature).
# Mirrors yubaba's optional dep so both processes can share crates.io artifacts.
containerd-client = { version = "0.9", optional = true }
prost-types = { version = "0.14", optional = true }
# Shared containerd backend core (R592-T1) — OCI-spec building, image/rootfs
# resolution, task-status querying. One home for both kamaji and kamaji-bin.
kamaji-containerd-core = { path = "../kamaji-containerd-core", optional = true, version = "0.8.29", default-features = false }
# Socket-custodian primitive (R599-F9 / R600-F9) — kamaji holds the passway
# listen fd and hands it to each generation so a cert reload drops no
# connections. Only the `socket-custody` feature of kamaji is pulled in (just
# `nix`); gated behind containerd-integration since only the fleet backend uses it.
kamaji = { path = "../kamaji", optional = true, default-features = false, version = "0.8.29" }

# R599-F10 node bundle backend (only linked with the `bundle-serving` feature).
# yah-object-store is the R2/in-memory blob store; yah-mesofact-bundle (store
# feature) materializes a W272 bundle from it into the node cache. Both live in
# oss/yah-base, redirected to path by the root [patch.crates-io] block.
yah-object-store = { version = "0.8.29", optional = true }
yah-mesofact-bundle = { version = "0.8.29", optional = true }

# Linux-only syscall surface used by the native driver (R406-T5).
# All three are permissive (MIT / Apache-2.0). The `landlock` crate is a thin
# wrapper over the kernel API; `caps` is the standard cap-juggling crate.
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["fs", "process", "user", "signal"] }
landlock = "0.4"
caps = "0.5"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# R428-F2 adds `test-util` (paused-clock timer control for the audit forwarder tests).
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync", "fs", "signal", "time", "test-util", "process"] }

# R426-F5 — drives the production verifier path against the in-process mock
# issuer end-to-end (boot → JWKS fetch → mint → verify).
cheers-mock = { path = "../cheers-mock" }
serde_json = "1.0"

# R592-T5 — the sibling-shape KamajiClient, so the integration test can drive
# a real WorkloadSpec through the postcard UDS into this crate's dispatch loop
# exactly as a live yubaba does. `sibling` pulls in kamaji-proto for the codec.
kamaji = { path = "../kamaji", features = ["sibling"] }
