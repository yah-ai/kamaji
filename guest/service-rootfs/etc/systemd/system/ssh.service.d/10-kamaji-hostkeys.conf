# Per-guest SSH host keys (R605-F32).
#
# The image ships WITHOUT host keys: every service guest's root is a private
# copy of one image, so keys baked at build time would be the same keys on
# every member booted from it. `ssh-keygen -A` creates whichever are missing,
# on the first boot only — the root is durable, so they are then that guest's
# for good. It has to run before Debian's own `sshd -t` check, which refuses a
# configuration with no host keys; hence the reset of the list.
[Service]
ExecStartPre=
ExecStartPre=/usr/bin/ssh-keygen -A
ExecStartPre=/usr/sbin/sshd -t
