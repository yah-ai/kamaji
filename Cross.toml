# `cross` pre-build hooks for the kamaji musl release build. kamaji lives in
# the independent `oss/kamaji` workspace (extracted from oss/yubaba, excluded
# from the yah root workspace), so `cross` run from here resolves THIS config.
# Keep the protoc hook in sync with oss/yubaba/Cross.toml.
#
# protoc: kamaji-proto (prost/tonic build) and containerd-client's build script
# (pulled in via kamaji-bin under `--features containerd-integration`) shell out
# to `protoc` with `--experimental_allow_proto3_optional`, requiring protoc
# >= 3.12. The cross images' apt protoc is too old, so download a prebuilt
# release binary. Build scripts always run on the x86_64 build host regardless
# of target triple, so both targets fetch the linux-x86_64 archive.
#
# Repo-root volume: oss/kamaji's [patch.crates-io] redirects yah-workload-spec
# to ../yah-base/crates/workload-spec — a crate in the SIBLING oss/yah-base
# workspace. cross mounts only the oss/kamaji workspace dir into the build
# container by default, so that ../yah-base path dep falls outside the mount →
# "failed to find a workspace root". Bind-mounting the whole repo (via the
# YAH_REPO_ROOT env var, set to the repo root in release.yml) at its real path
# makes oss/yah-base visible.
[build.env]
volumes = ["YAH_REPO_ROOT"]

# Image pins: Rust >= 1.96 needs glibc 2.28+; the `main` images (Ubuntu 20.04,
# glibc 2.31) stay compatible with current stable Rust.
[target.x86_64-unknown-linux-musl]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-musl:main"
pre-build = [
    "apt-get update && apt-get install -y --no-install-recommends curl ca-certificates unzip",
    "curl -fsSL https://github.com/protocolbuffers/protobuf/releases/download/v25.1/protoc-25.1-linux-x86_64.zip -o /tmp/protoc.zip",
    "unzip -o /tmp/protoc.zip -d /usr/local",
    "protoc --version",
]

[target.aarch64-unknown-linux-musl]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-musl:main"
pre-build = [
    "apt-get update && apt-get install -y --no-install-recommends curl ca-certificates unzip",
    "curl -fsSL https://github.com/protocolbuffers/protobuf/releases/download/v25.1/protoc-25.1-linux-x86_64.zip -o /tmp/protoc.zip",
    "unzip -o /tmp/protoc.zip -d /usr/local",
    "protoc --version",
]
