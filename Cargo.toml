[workspace]
members = [
    "crates/kamaji-proto",
    # R715-F3 / W315: the producer-side helper for the process-control channel.
    # Homed here because kamaji owns the `WorkloadState` vocabulary the channel
    # reuses — helper and enum move together or they drift.
    "crates/procctl",
    "crates/kamaji-containerd-core",
    "crates/kamaji",
    # R605-F14: `/sbin/init` inside the microVM guest. Homed here rather than in
    # a separate repo because it is the other half of the `MicroVmJob` contract
    # in crates/kamaji/src/microvm.rs — the two must be reviewable in one diff
    # even though they ship as separate artifacts.
    "crates/kamaji-guest-init",
    "crates/kamaji-bin",
    "crates/cheers-mock",
]
resolver = "2"

[workspace.package]
version = "0.8.37"
edition = "2021"
authors = ["yah Dev <human@yah.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yah-ai/kamaji"

# Base crates live in the yah-base repo; redirect the version-based deps to
# their local path for atomic monorepo dev. Stripped on export
# (scripts/export-oss.sh) so the standalone mirror resolves yah-base from
# crates.io.
